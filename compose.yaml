name: platform
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup-local.ts first}
    ports:
      - "127.0.0.1:8763:5432"
    volumes:
      - platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8764:1025"
      - "127.0.0.1:8765:8025"
volumes:
  platform-db:
